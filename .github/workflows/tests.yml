name: Tests

on:
  push:
    branches: [main]
  pull_request:

# Both jobs only read the repository. Without an explicit block the token is
# issued with the default permissions, and in repositories created before that
# default changed those are contents: write, which means a compromised dev
# dependency running scripts during composer update can push a commit or create
# a tag that Packagist then ships to every consumer.
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        dependencies: ['highest', 'lowest']

    name: PHP ${{ matrix.php }} — ${{ matrix.dependencies }} deps

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          # intl is required by filament/support, zip by openspout/openspout
          # (transitive through filament/actions). Without either, composer
          # refuses to resolve at all.
          extensions: intl, zip, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: |
          composer update --prefer-dist --no-interaction --no-progress \
            ${{ matrix.dependencies == 'lowest' && '--prefer-lowest --prefer-stable' || '--prefer-stable' }}

      - name: Run tests
        run: vendor/bin/pest

  quality:
    runs-on: ubuntu-latest
    name: Code quality (lint + static analysis)

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: intl, zip, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Check code style (Pint)
        run: vendor/bin/pint --test

      - name: Static analysis (PHPStan)
        # 512M, not the 128M default: level max over the Filament tree crashes a
        # parallel worker at the default and reports it as "result is incomplete"
        # rather than as a failure, which is easy to read as a pass.
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M
